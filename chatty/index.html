<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HaHa - App Information</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0D0D0F;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 40px;
        }
        h1 {
            font-size: 2.5rem;
            color: #ffffff;
            margin-bottom: 10px;
            letter-spacing: 10px;
        }
        .subtitle {
            color: #888;
            font-size: 0.85rem;
            letter-spacing: 4px;
            margin-bottom: 44px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }
        a.link {
            color: #ffffff;
            text-decoration: none;
            padding: 12px 32px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            transition: all 0.3s;
            letter-spacing: 2px;
            font-size: 0.9rem;
            min-width: 240px;
        }
        a.link:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.5);
        }
        .back {
            display: inline-block;
            margin-top: 40px;
            color: #666;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 2px;
        }
        .back:hover { color: #aaa; }
    </style>
</head>
<body>
    <div class="container">
        <h1>HA HA</h1>
        <p class="subtitle">APP INFORMATION</p>
        <div class="links">
            <a href="privacy.html" class="link">Privacy Policy</a>
            <a href="terms.html" class="link">Terms of Use</a>
            <a href="support.html" class="link">Support</a>
        </div>
        <a href="../index.html" class="back">← All apps &amp; games</a>
    </div>
</body>
</html>
